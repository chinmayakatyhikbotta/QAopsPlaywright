name: Playwright Tests

on:
  push:
    branches: [main, master, karthikchanges1]
  pull_request:
    branches: [main, master, karthikchanges1]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CLIENT_APP_EMAIL: ${{ secrets.CLIENT_APP_EMAIL }}
          CLIENT_APP_PASSWORD: ${{ secrets.CLIENT_APP_PASSWORD }}
          PRODUCT_ORDERED_ID: ${{ secrets.PRODUCT_ORDERED_ID }}
          ORDER_PRODUCT_NAME: ${{ secrets.ORDER_PRODUCT_NAME }}
          EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
          EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
        run: npm run test:ci

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
